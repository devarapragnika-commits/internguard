<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>InternGuard Inbox</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="kicker">InternGuard</p>
      <h1>Page scan</h1>
      <p class="lede">Score a LinkedIn or Indeed listing already on the page. Gmail list badges and sandbox fixtures still work with no extra account.</p>
    </header>
    <p id="status">Loading…</p>
    <section id="listing-result" hidden>
      <h2 id="listing-heading">This listing</h2>
      <div id="listing-detail" class="detail"></div>
    </section>
    <h2 id="gmail-heading" hidden>This Gmail tab</h2>
    <ul id="gmail-list"></ul>
    <h2 id="sandbox-heading">Sandbox fixtures</h2>
    <ul id="list"></ul>
    <script src="popup.js"></script>
  </body>
</html>
